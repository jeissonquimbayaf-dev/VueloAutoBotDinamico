name: Buscador y Alerta Diaria de Vuelos

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 7:00 AM Colombia (12:00 UTC)
  workflow_dispatch:
    inputs:
      origen:
        description: 'Ciudad de origen'
        required: false
        default: 'Bogotá (BOG)'
      destino:
        description: 'Ciudad de destino'
        required: false
        default: ''
      fecha_inicio:
        description: 'Rango inicio'
        required: false
        default: ''
      fecha_fin:
        description: 'Rango fin'
        required: false
        default: ''
      duracion_dias:
        description: 'Días de estadía'
        required: false
        default: '4'
      actualizar_diario:
        description: 'Guardar como alerta diaria'
        required: false
        default: 'true'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de búsqueda
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Toma el valor enviado desde la Web App o los valores guardados por defecto para el cron diario
          ORIGEN: ${{ github.event.inputs.origen || vars.LAST_ORIGEN || 'Bogotá (BOG)' }}
          DESTINO: ${{ github.event.inputs.destino || vars.LAST_DESTINO || 'Santa Marta (SMR)' }}
          FECHA_INICIO: ${{ github.event.inputs.fecha_inicio || vars.LAST_FECHA_INICIO || 'mediados de agosto de 2026' }}
          FECHA_FIN: ${{ github.event.inputs.fecha_fin || vars.LAST_FECHA_FIN || 'mediados de septiembre de 2026' }}
          DURACION_DIAS: ${{ github.event.inputs.duracion_dias || vars.LAST_DURACION_DIAS || '4' }}
        run: python bot.py
